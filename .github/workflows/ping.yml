name: keep-amon-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Random delay then ping
        run: |
          sleep $((RANDOM % 90))
          curl -fsS -m 90 --retry 3 --retry-delay 10 https://amon-backend.onrender.com/health -o /dev/null -w "%{http_code} %{time_total}s\n"
